# Lumen: builds a debug APK and runs unit tests on every push / PR.
name: Build APK

on:
  push:
    paths-ignore: ['**.md', 'doc/**', 'fastlane/**', 'assets/**', 'graphify-out/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest -DskipChecks --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lumen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
