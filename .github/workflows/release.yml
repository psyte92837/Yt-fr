# Lumen: builds a release APK on a v* tag and publishes it to GitHub Releases.
# With repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD the APK is signed
# with your key. Without them a "continuous" APK (optimised, signed with a debug key) is published instead.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumen.jks"
            echo "path=$RUNNER_TEMP/lumen.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — publishing a debug-key-signed APK."
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          LUMEN_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -DskipChecks --stacktrace
          mkdir -p dist && cp app/build/outputs/apk/std/release/*.apk "dist/lumen-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/lens/release/*.apk "dist/lumen-lens-${GITHUB_REF_NAME}.apk"

      - name: Build continuous APK (no keystore)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          ./gradlew assembleContinuous -DskipChecks --stacktrace
          mkdir -p dist && cp app/build/outputs/apk/std/continuous/*.apk "dist/lumen-${GITHUB_REF_NAME}-unsigned-key.apk"
          cp app/build/outputs/apk/lens/continuous/*.apk "dist/lumen-lens-${GITHUB_REF_NAME}-unsigned-key.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lumen-release-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
