# Lumen: один скрипт сборки APK.
# Положите в пустой репозиторий два файла:
#   lumen.patch                          (в корень)
#   .github/workflows/build-lumen.yml    (этот файл)
# Скрипт сам скачает NewPipe, применит патч Lumen и соберёт APK.
# Запуск: вкладка Actions -> "Build Lumen APK" -> Run workflow.
name: Build Lumen APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать как релиз (тег v-дата)"
        type: boolean
        default: false
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  NEWPIPE_COMMIT: acb7dfd658a8478686d0f8a0c389269d0ca8df95

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get lumen.patch from this repository
        uses: actions/checkout@v6
        with:
          path: kit

      - name: Download NewPipe source
        run: |
          git init -q NewPipe
          cd NewPipe
          git remote add origin https://github.com/TeamNewPipe/NewPipe.git
          git fetch -q --depth 1 origin "$NEWPIPE_COMMIT"
          git checkout -q -B main FETCH_HEAD

      - name: Apply Lumen patch
        working-directory: NewPipe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --3way ../kit/lumen.patch
          ls app/src/main/java/org/schabi/newpipe/lumen

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: NewPipe
        run: ./gradlew assembleDebug testDebugUnitTest -DskipChecks --stacktrace

      - name: Build release APK
        if: inputs.release
        working-directory: NewPipe
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumen.jks"
            export LUMEN_KEYSTORE_FILE="$RUNNER_TEMP/lumen.jks"
            ./gradlew assembleRelease -DskipChecks --stacktrace
            cp app/build/outputs/apk/release/*.apk ../lumen-release.apk
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — релиз подписан отладочным ключом."
            ./gradlew assembleContinuous -DskipChecks --stacktrace
            cp app/build/outputs/apk/continuous/*.apk ../lumen-release.apk
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp NewPipe/app/build/outputs/apk/debug/*.apk dist/lumen-debug.apk
          if [ -f lumen-release.apk ]; then cp lumen-release.apk dist/; fi
          ls -la dist

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: lumen-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lumen build ${{ github.run_number }}
          files: dist/*.apk
