# Lumen: builds a release APK on a v* tag and publishes it to GitHub Releases.
# With repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD the APK is signed
# with your key. Without them a "continuous" APK (optimised, signed with a debug key) is published instead.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create on the current main (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: the release notes list every Lumen commit since the previous v* tag

      - name: Create the tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v*) ;; *) echo "::error::Tag must start with v"; exit 1 ;; esac
          git config user.name lumen-bot; git config user.email lumen-bot@users.noreply.github.com
          git tag -a "$TAG" -m "Lumen $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumen.jks"
            echo "path=$RUNNER_TEMP/lumen.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — publishing a debug-key-signed APK."
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          LUMEN_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -DskipChecks --stacktrace
          mkdir -p dist && cp app/build/outputs/apk/release/*.apk "dist/lumen-${RELEASE_TAG:-$GITHUB_REF_NAME}.apk"

      - name: Build continuous APK (no keystore)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          ./gradlew assembleContinuous -DskipChecks --stacktrace
          mkdir -p dist && cp app/build/outputs/apk/continuous/*.apk "dist/lumen-${RELEASE_TAG:-$GITHUB_REF_NAME}-unsigned-key.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lumen-release-apk
          path: dist/*.apk

      - name: Release notes (all Lumen commits since the previous v* tag)
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_SHA
          {
            echo "## Lumen ${RELEASE_TAG:-$GITHUB_REF_NAME}"
            echo
            if [ -n "$prev" ]; then echo "Изменения с $prev / Changes since $prev:"; else echo "Все изменения Lumen / All Lumen changes:"; fi
            echo
            git log --reverse --no-merges --format='- %s (%h)' --invert-grep --grep='\[skip ci\]' \
              --author='noreply@anthropic.com' --author='lumen-bot' "$range"
          } > dist/NOTES.md
          echo "$(grep -c '^- ' dist/NOTES.md) commits in notes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || github.ref_name }}
          name: Lumen ${{ env.RELEASE_TAG || github.ref_name }}
          files: dist/*.apk
          body_path: dist/NOTES.md
          make_latest: true
